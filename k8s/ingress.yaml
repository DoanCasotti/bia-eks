apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bia-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/group.name: bia-alb
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: ACM_ARN_PLACEHOLDER
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-2016-08
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/subnets: SUBNET_A_PLACEHOLDER,SUBNET_B_PLACEHOLDER
spec:
  ingressClassName: alb
  rules:
    - host: bia-eks.projeto-aws.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bia
                port:
                  number: 8080
